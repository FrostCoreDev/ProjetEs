<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport Enseignement Scientifique | Vitesse du Son</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            border: 2px solid #ff4d4d;
            z-index: 1;
        }

        h1 {
            color: #ff4d4d;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            color: #cccccc;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-yes {
            background-color: #ff4d4d;
            color: white;
        }

        .btn-yes:hover {
            background-color: #ff1a1a;
        }

        .btn-no {
            background-color: #4caf50;
            color: white;
            position: absolute;
            right: 40px;
        }

        /* Styles pour l'image de troll qui apparaît */
        #trollImageContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        #trollImageContainer img {
            max-width: 80%;
            max-height: 70%;
            border-radius: 10px;
        }

        #trollImageContainer h2 {
            color: white;
            margin-top: 20px;
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1>Blocker par un Ransomware</h1>
        <p>Voulez vous regarder le rapport enseignement scientifique | Vitesse du Son ?</p>
        <div class="buttons">
            <button class="btn-yes" onclick="clickYes()">Non</button>
            <button class="btn-no" id="noBtn" onmouseover="moveButton()" onclick="clickNo()">Oui</button>
        </div>
    </div>

    <!-- Conteneur pour l'image de troll -->
    <div id="trollImageContainer">
        <img src="https://wallpapers.com/images/hd/trollface-meme-classic-kkgtoxdnlpnps08e.jpg" alt="Troll Face">
        <h2>Indisponible (Raison: Fermer)</h2>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noBtn');
            
            // Déplace le bouton à une position aléatoire
            const x = Math.random() * (window.innerWidth - btn.clientWidth);
            const y = Math.random() * (window.innerHeight - btn.clientHeight);

            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function clickYes() {
	    window.open("https://pixabay.com/fr/photos/search/chats/", "_blank");
            setTimeout(() => {
                alert("<Manifest.Syntax.line: '67'> Erreur ?");
            }, 500);
        }

        function clickNo() {
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('trollImageContainer').style.display = 'flex';
        }
    </script>

</body>
</html>
